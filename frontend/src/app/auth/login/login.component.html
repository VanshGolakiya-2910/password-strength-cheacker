<div class="auth-shell">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="subtext">Log in to continue saving and tracking passwords.</p>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="mb-3">
        <label class="form-label">Username or Email</label>
        <input class="form-control" [(ngModel)]="identifier" name="identifier" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            required
          >
          <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>Don't have an account?</span>
      <a routerLink="/register">Create one</a>
    </div>
  </div>
</div>
