<div class="auth-shell">
  <div class="auth-card">
    <h2>Create account</h2>
    <p class="subtext">Start saving passwords with your profile.</p>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="grid-2">
        <div class="mb-3">
          <label class="form-label">First name</label>
          <input class="form-control" [(ngModel)]="firstName" name="firstName">
        </div>
        <div class="mb-3">
          <label class="form-label">Last name</label>
          <input class="form-control" [(ngModel)]="lastName" name="lastName">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" [(ngModel)]="username" name="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating...' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
