<div class="auth-shell">
  <div class="auth-card">
    <img class="auth-logo" src="/password-manager.svg" alt="Password Manager" />
    <h2>Create account</h2>
    <p class="subtext">Start saving passwords with your profile.</p>

    <form (ngSubmit)="submit()" class="auth-form">
      <div class="grid-2">
        <div class="mb-3">
          <label class="form-label">First name</label>
          <input class="form-control" [(ngModel)]="firstName" name="firstName">
        </div>
        <div class="mb-3">
          <label class="form-label">Last name</label>
          <input class="form-control" [(ngModel)]="lastName" name="lastName">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" [(ngModel)]="username" name="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label class="form-label mb-0">Password</label>
          <button type="button" class="btn btn-sm btn-outline-primary" (click)="suggestPassword()">
            <i class="bi bi-sparkles"></i> Suggest Strong
          </button>
        </div>
        <div class="password-input-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            (input)="onPasswordChange()"
            placeholder="Enter password"
            required
          >
          <button type="button" class="btn-toggle-password" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>

        <div *ngIf="passwordStrength.strength" class="strength-row mt-2">
          <div class="strength-meter">
            <div
              class="progress-bar"
              [ngClass]="passwordStrength.strengthClass"
              [style.width.%]="passwordStrength.strengthScore"
              role="progressbar"
            ></div>
          </div>
          <div class="strength-meta">
            <span
              class="strength-pill"
              [ngClass]="{
                'pill-very-weak': passwordStrength.strength === 'Very Weak',
                'pill-weak': passwordStrength.strength === 'Weak',
                'pill-medium': passwordStrength.strength === 'Medium',
                'pill-strong': passwordStrength.strength === 'Strong',
                'pill-very-strong': passwordStrength.strength === 'Very Strong'
              }"
            >
              {{ passwordStrength.strength }}
            </span>
            <span class="score">{{ passwordStrength.strengthScore }}%</span>
          </div>
        </div>

        <div *ngIf="passwordStrength.feedback.length" class="feedback-small mt-2">
          <span class="chip-small" *ngFor="let msg of passwordStrength.feedback">{{ msg }}</span>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <div class="password-input-wrapper">
          <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="confirmPassword" 
                 name="confirmPassword"
                 placeholder="Confirm password">
          <button type="button" class="btn-toggle-password" (click)="toggleConfirmPasswordVisibility()">
            <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating...' : 'Create Account' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
